[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"


[project]
name = "mlforge"
version = "1.0.1"
description = "Production-grade MLOps platform for model training, validation, deployment, monitoring, drift detection, and automated retraining."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [
    { name = "Ankur Kumar Jaiswal" }
]

dependencies = [
    "numpy>=2.1,<3.0",
    "pandas>=2.2,<3.0",
    "scikit-learn>=1.5,<2.0",
    "pandera>=0.20,<1.0",
    "PyYAML>=6.0,<7.0",
    "mlflow>=3.5,<4.0",
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "pydantic-settings>=2.7,<3.0",
]


[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10.0",
    "ruff>=0.8,<1.0",
    "jupyter>=1.1,<2.0",
    "httpx>=0.28,<1.0",
]


[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"


[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]


[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
