# Day 3 MLflow experiment tracking and registry configuration.

tracking:
  uri: "sqlite:///mlruns/mlflow.db"
  artifact_root: "mlruns/artifacts"
  experiment_name: "mlforge-churn"
  registry_uri: "sqlite:///mlruns/mlflow.db"

registry:
  model_name: "MLForgeChurnClassifier"

quality_gates:
  min_roc_auc: 0.80
  min_average_precision: 0.55
  min_recall: 0.50

tags:
  project: "mlforge"
  dataset: "telco_churn"
  lifecycle_stage: "validation"
